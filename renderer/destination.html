<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JomJalan — Destination</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png" />
</head>
<body>
  <nav class="app-navbar">
    <div class="nav-brand">
      <span class="material-symbols-sharp nav-logo-icon">flight_takeoff</span>
      <span class="nav-title">JomJalan</span>
    </div>
    <div class="nav-links">
      <a href="discover.html" id="navDiscoverBtn" class="nav-link">
        <span class="material-symbols-sharp icon-sm">search</span>
        <span>Discover</span>
      </a>
      <a href="trips.html" id="navTripsBtn" class="nav-link">
        <span class="material-symbols-sharp icon-sm">luggage</span>
        <span>My Trips</span>
        <span id="tripsBadge" class="nav-badge" hidden></span>
      </a>
    </div>
  </nav>

  <main class="app home-app">
    <!-- Notification banner for CRUD feedback -->
    <div id="appToast" class="app-toast" hidden role="alert" aria-live="polite"></div>

    <section id="destinationView" class="view destination-view">
      <div class="destination-top-bar">
        <a href="discover.html" id="backBtn" class="back-button">
          <span class="material-symbols-sharp icon-sm">arrow_back</span>
          <span>Back</span>
        </a>
      </div>

      <div class="destination-header-row">
        <header class="destination-header">
          <p id="destinationType" class="eyebrow"></p>
          <h1 id="destinationTitle"></h1>
          <p id="destinationSubtitle" class="tagline"></p>
        </header>
        <div class="destination-actions">
          <button type="button" id="saveTripBtn" class="primary-btn save-trip-btn">
            <span class="material-symbols-sharp icon-sm">add</span>
            <span>Save as Trip Plan</span>
          </button>
        </div>
      </div>

      <!-- Destination Photos Status / Feedback if needed -->
      <p id="photosMessage" class="photos-message" role="status" hidden></p>

      <!-- Two-column split layout: Left (Background Cover + Country Info), Right (Weather + Suggested Activities) -->
      <div class="places-split-layout">
        <div class="places-column places-column-left">
          <!-- Country/city background image banner (stays within left half of page) -->
          <div id="destinationCover" class="destination-cover-banner" hidden>
            <div class="destination-cover-overlay"></div>
          </div>

          <!-- Country facts loaded from countries.dev, positioned directly below the background image -->
          <section
            id="countryInfo"
            class="info-panel country-info"
            aria-live="polite"
            hidden
          ></section>
        </div>

        <div class="places-column places-column-right">
          <!-- Current weather for the selected country or city -->
          <section
            id="weatherInfo"
            class="info-panel weather-info"
            aria-live="polite"
            hidden
          ></section>

          <!-- Suggested activities based on country and current weather -->
          <section
            id="recommendationsInfo"
            class="info-panel recommendations-info"
            aria-live="polite"
            hidden
          ></section>
        </div>
      </div>

      <!-- Currency converter using Frankfurter API for budget calculations. -->
      <section
        id="currencyConverter"
        class="info-panel currency-panel"
        aria-live="polite"
        hidden
      >
        <div class="converter-header">
          <h2 class="converter-title">Currency Converter</h2>
        </div>
        <form id="currencyForm" class="currency-form">
          <div class="currency-field">
            <label for="currencyAmount">Amount</label>
            <input
              type="number"
              id="currencyAmount"
              min="0.01"
              step="any"
              value="100"
              placeholder="100"
              required
            />
          </div>
          <div class="currency-field">
            <label for="currencyFrom">From</label>
            <div id="currencyFromStatic" class="currency-static-badge" hidden></div>
            <select id="currencyFrom"></select>
          </div>
          <button type="button" id="currencySwapBtn" class="currency-swap-btn" title="Swap direction" aria-label="Swap direction">
            <span class="material-symbols-sharp">swap_horiz</span>
          </button>
          <div class="currency-field">
            <label for="currencyTo">To</label>
            <div id="currencyToStatic" class="currency-static-badge" hidden></div>
            <select id="currencyTo" hidden></select>
          </div>
          <button type="submit" id="currencyConvertBtn">Convert</button>
        </form>
        <div id="currencyResult" class="currency-result" hidden></div>
        <p id="currencyMessage" class="currency-message" role="status"></p>
      </section>

      <p id="poiMessage" class="message" role="status"></p>

      <section id="poiResults" class="poi-grid" aria-live="polite"></section>
    </section>

    <!-- Trip Modal (Used for Create Plan) -->
    <div id="tripModal" class="modal-backdrop" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Save as Trip Plan</h2>
          <button type="button" id="modalCloseBtn" class="modal-close" aria-label="Close dialog">
            <span class="material-symbols-sharp">close</span>
          </button>
        </div>
        <form id="tripForm" class="trip-form">
          <input type="hidden" id="tripId" />

          <div class="form-group">
            <label for="formDestinationName">Destination <span class="required">*</span></label>
            <input type="text" id="formDestinationName" required placeholder="e.g. Kyoto, Japan" />
          </div>

          <div class="form-group">
            <label for="formCountry">Country</label>
            <input type="text" id="formCountry" placeholder="e.g. Japan" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="formTravelDate">Travel Date <span class="required">*</span></label>
              <input type="date" id="formTravelDate" required />
            </div>
            <div class="form-group">
              <label for="formDuration">Duration (days) <span class="required">*</span></label>
              <input type="number" id="formDuration" min="1" step="1" value="5" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="formTravelers">Travelers <span class="required">*</span></label>
              <input type="number" id="formTravelers" min="1" step="1" value="1" required />
            </div>
            <div class="form-group">
              <label for="formBudget">Total Budget (RM) <span class="required">*</span></label>
              <div class="input-with-currency-prefix">
                <span class="currency-prefix">RM</span>
                <input type="number" id="formBudget" min="0" step="any" value="2000" required placeholder="0.00" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="formNotes">Notes & Itinerary Details</label>
            <textarea id="formNotes" rows="3" placeholder="Add packing list, flight info, or personal itinerary notes..."></textarea>
          </div>

          <!-- Associated Recommendations Section -->
          <div id="formRecommendationsGroup" class="form-group">
            <label>Saved Recommendations</label>
            <div id="formRecommendationsPreview" class="form-recs-preview">
              <span class="text-muted">No recommendations attached.</span>
            </div>
          </div>

          <p id="formErrorMessage" class="form-error-message" role="alert" hidden></p>

          <div class="modal-footer">
            <button type="button" id="modalCancelBtn" class="button-secondary">Cancel</button>
            <button type="submit" id="modalSaveBtn" class="primary-btn">Save Trip</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="destination.js"></script>
</body>
</html>
